<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>望安綠蠵龜保育中心｜數位守護門戶</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
        }

        /* 實景背景層 */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('wangan_center.png'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* 深色遮罩讓白字更清晰 */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 30, 40, 0.4); 
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .header h1 { font-size: 2.2rem; margin: 0; letter-spacing: 2px; }
        .header p { font-size: 1.1rem; margin-top: 10px; opacity: 0.9; }

        /* 四宮格選單 */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 850px;
        }

        @media (max-width: 700px) {
            .grid-menu { grid-template-columns: 1fr; gap: 15px; }
            .header h1 { font-size: 1.8rem; }
        }

        /* 毛玻璃卡片樣式 */
        .menu-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 30px 20px;
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .menu-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-icon { font-size: 3rem; margin-bottom: 15px; }
        .card-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; }
        .card-desc { font-size: 0.9rem; opacity: 0.85; line-height: 1.4; }

        .footer-tag {
            position: absolute;
            bottom: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="bg-container"></div>
<div class="overlay"></div>

<div class="content-wrapper">
    <div class="header">
        <h1>🐢 望安綠蠵龜保育中心</h1>
        <p>澎湖望安｜數位守護者平台</p>
    </div>

    <div class="grid-menu">
        <a href="events.html" class="menu-card">
            <div class="card-icon">📅</div>
            <div class="card-title">每月大小事</div>
            <div class="card-desc">最新活動訊息與線上報名系統</div>
        </a>

        <a href="https://wei0417-creator.github.io/wanganturtle/" class="menu-card">
            <div class="card-icon">🗿</div>
            <div class="card-title">望安巡守者</div>
            <div class="card-desc">好善堂精神傳承與環境巡視</div>
        </a>

        <a href="https://wei0417-creator.github.io/seaturtle/" class="menu-card">
            <div class="card-icon">🔍</div>
            <div class="card-title">海龜守護者</div>
            <div class="card-desc">館內實境互動與守護者挑戰</div>
        </a>

        <a href="diary.html" class="menu-card">
            <div class="card-icon">🎥</div>
            <div class="card-title">海龜日誌</div>
            <div class="card-desc">每日成長影像紀錄與加油打氣</div>
        </a>
    </div>

    <div class="footer-tag">
        台灣長期健康照顧產業發展協會澎湖辦事處 技術支援｜守護望安海洋生態
    </div>
</div>

</body>
</html>
