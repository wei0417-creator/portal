<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每月大小事｜望安綠蠵龜保育中心</title>
    <style>
        :root { --primary: #00796b; --secondary: #004d40; --price: #d32f2f; }
        body { font-family: 'Microsoft JhengHei', sans-serif; margin: 0; background: #f0f4f5; color: #333; display: flex; flex-direction: column; align-items: center; }
        .nav-bar { width: 100%; padding: 15px; background: var(--secondary); position: fixed; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; color: white; }
        .back-btn { color: white; text-decoration: none; font-size: 14px; border: 1px solid white; padding: 6px 15px; border-radius: 20px; }
        .container { margin-top: 100px; width: 95%; max-width: 800px; padding-bottom: 50px; }
        .event-card { background: white; border-radius: 25px; overflow: hidden; display: flex; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .event-date { background: var(--primary); color: white; width: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; }
        .event-info { padding: 25px; flex: 1; }
        .btn { padding: 12px 20px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-reg { background: var(--primary); color: white; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 30px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; }
        .bank-info { background: #fff9c4; padding: 15px; border-radius: 15px; text-align: left; font-size: 14px; margin: 15px 0; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="back-btn">← 回門戶首頁</a>
    <span style="font-weight:bold;">📅 每月大小事</span>
    <div style="width:70px;"></div>
</div>

<div class="container">
    <div id="event-list">載入中...</div>
</div>

<div id="reg-modal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="form-title">預約報名</h3>
        <input type="text" id="reg-name" placeholder="姓名">
        <input type="tel" id="reg-phone" placeholder="電話">
        <input type="number" id="reg-people" placeholder="人數" min="1" value="1">
        <button onclick="submitReg()" class="btn btn-reg">確認報名並查看匯款資訊</button>
        <button onclick="closeModal('reg-modal')" style="background:none; border:none; color:#aaa; cursor:pointer; margin-top:10px;">取消</button>
    </div>
</div>

<div id="pay-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>💰 匯款回報</h3>
        <div class="bank-info" id="bank-info-box"></div>
        <input type="text" id="pay-name" placeholder="報名姓名">
        <input type="text" id="pay-code" placeholder="帳號末五碼" maxlength="5">
        <button onclick="submitPay()" class="btn btn-reg">提交核對</button>
        <button onclick="closeModal('pay-modal')" style="background:none; border:none; color:#aaa; cursor:pointer; margin-top:10px;">關閉</button>
    </div>
</div>

<script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbwi7ZxPQV3i14SJqCIs8A1s90ZVzrCNXkfnrQGWvFSbPh7vMZdE23u8CevesiHNPc5sng/exec";
    let eventsData = [];
    let currentEvent = null;

    // 1. 抓取活動
    function fetchEvents() {
        fetch(gasUrl + "?action=getEvents")
        .then(res => res.json())
        .then(data => {
            eventsData = data;
            renderEvents();
        });
    }

    function renderEvents() {
        const list = document.getElementById('event-list');
        list.innerHTML = eventsData.map(ev => `
            <div class="event-card">
                <div class="event-date"><span>${ev.month}</span><span style="font-size:24px;">${ev.day}</span></div>
                <div class="event-info">
                    <h3 style="margin:0;">${ev.title}</h3>
                    <p style="color:var(--price); font-weight:bold;">NT$ ${ev.price} / 人</p>
                    <p style="font-size:14px; color:#666;">${ev.desc}</p>
                    <button class="btn btn-reg" onclick="openReg('${ev.title}', ${ev.price})">立即預約</button>
                    <button class="btn" style="background:#eee;" onclick="openPay('${ev.title}', '${ev.bank}')">已匯款回報</button>
                </div>
            </div>
        `).join('');
    }

    function openReg(title, price) {
        currentEvent = { title, price };
        document.getElementById('form-title').innerText = title;
        document.getElementById('reg-modal').style.display = 'flex';
    }

    function openPay(title, bank) {
        currentEvent = { title };
        document.getElementById('bank-info-box').innerHTML = `<b>活動：${title}</b><br>匯款資訊：${bank}`;
        document.getElementById('pay-modal').style.display = 'flex';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // 3. 提交報名
    function submitReg() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        const people = document.getElementById('reg-people').value;
        if(!name || !phone) return alert("請填寫完整");

        fetch(gasUrl, {
            method: "POST", mode: "no-cors",
            body: JSON.stringify({
                action: "register", title: currentEvent.title, name, phone, people, total: currentEvent.price * people
            })
        });
        alert("報名資料已送出，請記得匯款並回來回報末五碼！");
        closeModal('reg-modal');
    }

    // 4. 提交末五碼
    function submitPay() {
        const name = document.getElementById('pay-name').value;
        const code = document.getElementById('pay-code').value;
        if(!name || !code) return alert("請填寫完整");

        fetch(gasUrl, {
            method: "POST", mode: "no-cors",
            body: JSON.stringify({ action: "reportPayment", event: currentEvent.title, name, code })
        });
        alert("回報成功！工作人員將儘速核對。");
        closeModal('pay-modal');
    }

    window.onload = fetchEvents;
</script>
</body>
</html>
