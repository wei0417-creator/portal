<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海龜日誌｜望安綠蠵龜保育中心</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            margin: 0; background-color: #001a1f; color: white;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 頂部導航列 */
        .nav-bar {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); position: fixed; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn { 
            color: white; text-decoration: none; font-size: 14px; 
            border: 1px solid white; padding: 6px 15px; border-radius: 20px; 
            transition: 0.3s; background: rgba(255,255,255,0.1);
        }
        .back-btn:hover { background: white; color: #001a1f; }

        /* 內容容器 */
        .diary-container { margin-top: 90px; width: 95%; max-width: 500px; padding-bottom: 50px; }

        /* 日誌卡片 */
        .diary-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px; overflow: hidden; margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* YouTube 響應式容器 (16:9) */
        .video-responsive {
            overflow: hidden; padding-bottom: 56.25%; position: relative; height: 0;
            background: #000;
        }
        .video-responsive iframe {
            left: 0; top: 0; height: 100%; width: 100%; position: absolute; border: 0;
        }

        .info-box { padding: 20px; }
        .date-tag { font-size: 12px; color: #00ccff; font-weight: bold; }
        .diary-title { font-size: 19px; margin: 8px 0 10px 0; color: #fff; }
        .diary-desc { font-size: 14.5px; color: #ddd; line-height: 1.6; }

        /* 互動按鈕區 */
        .action-bar { 
            display: flex; gap: 12px; margin-top: 15px; padding-top: 15px; 
            border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .btn { 
            flex: 1; padding: 12px; border-radius: 15px; border: none; 
            font-weight: bold; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 6px; 
        }
        .btn-cheer { background: linear-gradient(135deg, #ff4081, #f50057); color: white; }
        .btn-comment { background: rgba(255,255,255,0.15); color: white; }
        .btn:active { transform: scale(0.95); }

        /* 留言區 */
        .comment-section { 
            background: rgba(0,0,0,0.3); padding: 20px; display: none; 
            border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .comment-item { font-size: 13.5px; margin-bottom: 12px; line-height: 1.5; color: #eee; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 8px; }
        .comment-user { color: #00ccff; font-weight: bold; margin-right: 8px; }

        /* 留言輸入 */
        .comment-input-group { display: flex; gap: 10px; margin-top: 15px; }
        .comment-input { 
            flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 12px; padding: 10px; color: white; font-size: 14px; outline: none;
        }
        .comment-input:focus { border-color: #00ccff; }
        .send-btn { background: #00796b; border: none; color: white; border-radius: 12px; padding: 0 18px; cursor: pointer; font-weight: bold; }

        .footer-note { font-size: 12px; opacity: 0.6; margin: 40px 0; text-align: center; line-height: 1.8; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="index.html" class="back-btn">← 回門戶首頁</a>
    <span style="font-size: 17px; font-weight: bold; letter-spacing: 1px;">🎥 海龜成長日誌</span>
    <div style="width:65px;"></div>
</div>

<div class="diary-container" id="diary-list">
    </div>

<div class="footer-note">
    讓愛跨越海洋 ｜ 守護望安生態紀錄<br>
    台灣長期健康照顧產業發展協會澎湖辦事處 技術支援
</div>

<script>
    // 影片資料庫
    const videoData = [
        {
            id: 1,
            date: "2025.11.04",
            title: "碳次郎跟橘豆子在望安畢業囉",
            desc: "今天天氣晴朗，兩個資優生要回家了！看牠們充滿活力的樣子，真替牠們高興。",
            ytId: "dUCQ1UTNK7I", 
            cheers: 245,
            comments: [
                { user: "志工阿強", text: "以後要再回來找我們喔。" },
                { user: "望安小龜粉", text: "要平安長大喔！" }
            ]
        },
        {
            id: 2,
            date: "2026.04.04",
            title: "保育人員的日常巡邏",
            desc: "即使是連續假期，巡邏工作也不間斷，為了守護下一代的海龜。大家辛苦了！",
            ytId: "3tmd-ClpJKA", 
            cheers: 189,
            comments: [
                { user: "遊客小玲", text: "辛苦你們了，謝謝你們守護望安。" }
            ]
        }
    ];

    function renderDiary() {
        const list = document.getElementById('diary-list');
        list.innerHTML = videoData.map(item => `
            <div class="diary-card">
                <div class="video-responsive">
                    <iframe src="https://www.youtube.com/embed/${item.ytId.trim()}?rel=0" 
                            title="YouTube video player" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen></iframe>
                </div>
                
                <div class="info-box">
                    <span class="date-tag">${item.date}</span>
                    <h3 class="diary-title">${item.title}</h3>
                    <p class="diary-desc">${item.desc}</p>
                    
                    <div class="action-bar">
                        <button class="btn btn-cheer" id="cheer-btn-${item.id}" onclick="cheer(${item.id})">❤️ 加油 (${item.cheers})</button>
                        <button class="btn btn-comment" onclick="toggleComments(${item.id})">💬 留言 (${item.comments.length})</button>
                    </div>
                </div>

                <div class="comment-section" id="comment-section-${item.id}">
                    <div id="comment-list-${item.id}">
                        ${item.comments.map(c => `<div class="comment-item"><span class="comment-user">${c.user}:</span>${c.text}</div>`).join('')}
                    </div>
                    <div class="comment-input-group">
                        <input type="text" class="comment-input" id="input-${item.id}" placeholder="想對小龜說的話...">
                        <button class="send-btn" onclick="addComment(${item.id})">發送</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 切換留言顯示/隱藏
    function toggleComments(id) {
        const section = document.getElementById(`comment-section-${id}`);
        const isVisible = section.style.display === 'block';
        section.style.display = isVisible ? 'none' : 'block';
    }

    // 模擬新增留言
    function addComment(id) {
        const input = document.getElementById(`input-${id}`);
        const text = input.value.trim();
        if (!text) return;

        const list = document.getElementById(`comment-list-${id}`);
        const div = document.createElement('div');
        div.className = 'comment-item';
        div.innerHTML = `<span class="comment-user">守護者:</span>${text}`;
        list.appendChild(div);
        
        input.value = "";
        console.log(`留言已暫存(ID:${id}): ${text}`);
    }

    // 加油打氣功能
    function cheer(id) {
        const btn = document.getElementById(`cheer-btn-${id}`);
        btn.innerHTML = "✨ 感謝加油！";
        btn.disabled = true;
        btn.style.background = "#444";
        btn.style.cursor = "default";
    }

    // 網頁載入後執行渲染
    window.onload = renderDiary;
</script>

</body>
</html>
